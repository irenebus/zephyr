# Gate 4: CAN shell + 1000-frame loopback burst
CONFIG_CAN=y
CONFIG_CAN_SHELL=y
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_CAN_LOG_LEVEL_OFF=y
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_SHELL_STACK_SIZE=4096
